services:
  claude-code:
    image: git.${DOMAIN}/joost/claude-code-docker:sha-f738e9f
    container_name: claude-code
    hostname: claude-code
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      - TZ
      - PUID
      - PGID
      - CLAUDE_REMOTE_NAME=nas
      - CODE_SERVER_PASSWORD
      # T3 Code server, paired directly (no T3 Connect account) through the
      # route below: docker compose exec claude-code t3-pair
      - T3_ENABLE=true
      - T3_PUBLIC_URL=https://${T3_URL}
    volumes:
      - ${APPDATA_PATH}/repos:/repos
      - ${MNT_PATH}/Syncthing/obsidian:/obsidian
      - ${APPDATA_PATH}/claude-code/claude:/home/claude/.claude
      - ${APPDATA_PATH}/claude-code/share:/home/claude/.local/share
      - ${APPDATA_PATH}/claude-code/config:/home/claude/.config
      # npm, go, pip, uv, mise and other caches; otherwise they fill docker.img
      - ${APPDATA_PATH}/claude-code/cache:/home/claude/.cache
      # T3 Code: server executable, paired devices, threads
      - ${APPDATA_PATH}/claude-code/t3:/home/claude/.t3

      - ${APPDATA_PATH}/.ssh:/home/claude/.ssh-keys:ro
    networks:
      - proxy
      - browser
      - angebote
    labels:
      traefik.enable: true
      traefik.http.routers.claude-code.tls: true
      traefik.http.routers.claude-code.tls.certresolver: letsencrypt
      traefik.http.routers.claude-code.rule: Host(`${SERVICE_URL}`)
      traefik.http.routers.claude-code.entrypoints: websecure
      traefik.http.routers.claude-code.service: claude-code
      traefik.http.services.claude-code.loadbalancer.server.port: 8080

      # T3 Code speaks plain HTTP; Traefik adds TLS (needed by app.t3.codes)
      traefik.http.routers.t3.tls: true
      traefik.http.routers.t3.tls.certresolver: letsencrypt
      traefik.http.routers.t3.rule: Host(`${T3_URL}`)
      traefik.http.routers.t3.entrypoints: websecure
      traefik.http.routers.t3.service: t3
      traefik.http.services.t3.loadbalancer.server.port: 3773

      glance.name: Claude Code
      glance.url: https://${SERVICE_URL}
      net.unraid.docker.webui: https://${SERVICE_URL}

  # Playwright MCP on Patchright (image from claude-code-docker/patchright-mcp)
  # driving full Google Chrome over CDP, the same setup as Karakeep's crawler.
  # Trips bot protection far less than the stock image's headless Chromium.
  # --isolated gives every MCP client its own context in the shared browser.
  playwright-mcp:
    image: git.${DOMAIN}/joost/patchright-mcp:sha-72c09b6
    container_name: playwright-mcp
    restart: unless-stopped
    command:
      - --cdp-endpoint
      - http://chrome:9222
      - --isolated
      - --viewport-size
      - 1920x1080
      - --port
      - "8931"
      - --host
      - 0.0.0.0
      - --allowed-hosts
      - "*"
    networks:
      - browser

  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:156.0.8078.47-r1
    container_name: playwright-chrome
    restart: unless-stopped
    init: true
    environment:
      - TZ
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --disable-blink-features=AutomationControlled
      - --window-size=1920,1080
    networks:
      - browser

networks:
  proxy:
    external: true
  # private link between claude-code and its browser sidecars; neither the MCP
  # nor the CDP endpoint has auth, so they must not sit on the shared proxy network
  browser: {}
  angebote:
    external: true
