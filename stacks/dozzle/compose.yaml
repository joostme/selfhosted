services:
  dockerproxy:
    image: ghcr.io/wollomatic/socket-proxy:1.13.1
    restart: unless-stopped
    user: "65534:281"
    mem_limit: 64M
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    command:
      - '-loglevel=info'
      - '-listenip=0.0.0.0'
      - '-allowfrom=dozzle'
      - '-allowGET=/v1\..{1,2}/(info|events|containers/.*)|/_ping'
      - '-allowHEAD=/_ping'
      - '-allowPOST=/v1\..{1,2}/containers/[a-zA-Z0-9_.-]+/(start|stop|restart)'
      - '-allowbindmountfrom=/var/log,/tmp'
      - '-watchdoginterval=3600'
      - '-stoponwatchdog'
      - '-shutdowngracetime=5'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxynet 


  dozzle:
    image: amir20/dozzle:v11.2.0
    container_name: dozzle
    depends_on:
      - dockerproxy
    volumes:
      - ${APPDATA_PATH}/dozzle:/data
    environment:
      - DOZZLE_REMOTE_HOST=tcp://dockerproxy:2375
      - DOZZLE_AUTH_PROVIDER=oidc
      - DOZZLE_AUTH_OIDC_ISSUER=https://id.${DOMAIN}
      - DOZZLE_AUTH_OIDC_CLIENT_ID=dozzle
      - DOZZLE_AUTH_OIDC_CLIENT_SECRET
      - DOZZLE_NO_ANALYTICS=true
      - DOZZLE_ENABLE_MCP=true
      - DOZZLE_ENABLE_ACTIONS=true
    networks:
      - proxy
      - docker-proxynet
    labels:
      traefik.enable: true
      traefik.http.routers.dozzle.tls: true
      traefik.http.routers.dozzle.tls.certresolver: letsencrypt
      traefik.http.routers.dozzle.rule: Host(`${SERVICE_URL}`)
      traefik.http.routers.dozzle.entrypoints: websecure

      glance.name: Dozzle
      glance.icon: sh:dozzle
      glance.url: https://${SERVICE_URL}
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/dozzle.png
      net.unraid.docker.webui: https://${SERVICE_URL}
    restart: unless-stopped
    
networks:
  proxy:
    external: true
  docker-proxynet:
    driver: bridge
    internal: true
