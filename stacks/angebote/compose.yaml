services:
  angebote:
    image: git.${DOMAIN}/${FORGEJO_USER}/angebote:sha-610948b
    container_name: angebote
    restart: unless-stopped
    pull_policy: always
    user: "${PUID}:${PGID}"
    environment:
      - TZ
      - EDEKA_MARKET_ID
      # turns the Lidl offers on, kept in the secrets file
      - ZIP_CODE
      # recipes whose ingredients are matched with the offers, kept in the secrets file
      - TANDOOR_BASE_URL
      - TANDOOR_API_KEY
      # iCloud link of the shortcut that puts the shopping note into Reminders
      - SHORTCUT_INSTALL_URL
    volumes:
      - ${APPDATA_PATH}/angebote/data:/data
    networks:
      # outbound internet access for fetching the store pages
      - default
      - angebote
      - proxy
    labels:
      traefik.enable: true
      traefik.docker.network: proxy
      traefik.http.routers.angebote.tls: true
      traefik.http.routers.angebote.tls.certresolver: letsencrypt
      traefik.http.routers.angebote.rule: Host(`${SERVICE_URL}`)
      traefik.http.routers.angebote.entrypoints: websecure
      traefik.http.routers.angebote.service: angebote
      # only the web page, not the MCP endpoint on 8080
      traefik.http.services.angebote.loadbalancer.server.port: 8081
      traefik.http.routers.angebote.middlewares: tinyauth

      tinyauth.apps.angebote.config.domain: ${SERVICE_URL}
      # the group allowed in comes from the secrets file
      tinyauth.apps.angebote.oauth.groups: ${TINYAUTH_GROUPS}

      glance.name: Angebote
      glance.url: https://${SERVICE_URL}
      net.unraid.docker.webui: https://${SERVICE_URL}

networks:
  # the MCP endpoint has no auth, so it is only reachable from claude-code
  angebote:
    external: true
  # the web page has no auth of its own, Traefik puts tinyauth in front of it
  proxy:
    external: true
