services:
  wallos:
    container_name: wallos
    image: bellamy/wallos:5.8.3
    environment:
      - TZ
    volumes:
      - ${APPDATA_PATH}/wallos/db:/var/www/html/db
      - ${APPDATA_PATH}/wallos/logos:/var/www/html/images/uploads/logos
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.wallos.tls: true
      traefik.http.routers.wallos.tls.certresolver: letsencrypt
      traefik.http.routers.wallos.rule: Host(`${SERVICE_URL}`)
      traefik.http.routers.wallos.entrypoints: websecure

      glance.name: Wallos
      glance.icon: sh:wallos
      glance.url: https://${SERVICE_URL}
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/wallos.png
      net.unraid.docker.webui: https://${SERVICE_URL}
    restart: unless-stopped

networks:
  proxy:
    external: true
