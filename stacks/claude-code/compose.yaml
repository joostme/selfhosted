services:
  claude-code:
    image: git.${DOMAIN}/joost/claude-code-docker:sha-48de5ac
    container_name: claude-code
    restart: unless-stopped
    environment:
      - TZ
      - PUID
      - PGID
      - CLAUDE_REMOTE_NAME=nas
      - CODE_SERVER_PASSWORD
    volumes:
      - ${APPDATA_PATH}/repos:/repos
      - ${APPDATA_PATH}/claude-code/claude:/home/claude/.claude
      - ${APPDATA_PATH}/claude-code/share:/home/claude/.local/share
      - ${APPDATA_PATH}/claude-code/config:/home/claude/.config

      - ${APPDATA_PATH}/.ssh:/home/claude/.ssh-keys:ro
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.claude-code.tls: true
      traefik.http.routers.claude-code.tls.certresolver: letsencrypt
      traefik.http.routers.claude-code.rule: Host(`${SERVICE_URL}`)
      traefik.http.routers.claude-code.entrypoints: websecure
      traefik.http.routers.claude-code.service: claude-code
      traefik.http.services.claude-code.loadbalancer.server.port: 8080

      glance.name: Claude Code
      glance.url: https://${SERVICE_URL}
      net.unraid.docker.webui: https://${SERVICE_URL}

networks:
  proxy:
    external: true
