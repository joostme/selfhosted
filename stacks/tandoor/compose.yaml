services:
  tandoor:
    container_name: tandoor
    image: vabene1111/recipes:2.6.15
    restart: unless-stopped
    environment:
      - TZ
      - PUID
      - PGID
      - DB_ENGINE=django.db.backends.sqlite3
      - ALLOWED_HOSTS=${SERVICE_URL}
      - POSTGRES_DB=/data/recipes.db
      - GUNICORN_MEDIA=1
      - GUNICORN_WORKERS=1
      - GUNICORN_THREADS=1
      - SOCIAL_PROVIDERS=allauth.socialaccount.providers.openid_connect
      # inline so Compose substitutes the secret; Conflux expands environment.env
      # before it reads secrets.env, so a reference there resolves to empty
      - 'SOCIALACCOUNT_PROVIDERS={"openid_connect": {"OAUTH_PKCE_ENABLED": True, "SCOPE": ["openid","profile","email","groups"], "APPS": [{"provider_id": "pocketid","name": "SSO","client_id": "tandoor","secret": "${TANDOOR_OAUTH_SECRET}","settings": {"server_url": "https://id.${DOMAIN}/.well-known/openid-configuration"}}]}}'
      - SECRET_KEY
    volumes:
      - ${APPDATA_PATH}/recipes/data:/data
      - ${APPDATA_PATH}/recipes/media:/opt/recipes/mediafiles/
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.tandoor.tls: true
      traefik.http.routers.tandoor.tls.certresolver: letsencrypt
      traefik.http.routers.tandoor.rule: Host(`${SERVICE_URL}`)
      traefik.http.routers.tandoor.entrypoints: websecure

      glance.name: Tandoor
      glance.icon: sh:tandoor-recipes
      glance.url: https://${SERVICE_URL}
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/tandoor-recipes.png
      net.unraid.docker.webui: https://${SERVICE_URL}
networks:
  proxy:
    external: true
