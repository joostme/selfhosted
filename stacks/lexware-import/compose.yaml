services:
  lexware-import:
    image: git.${DOMAIN}/joost/lexware-import:sha-4a68eeb
    container_name: lexware-import
    restart: unless-stopped
    pull_policy: always
    user: "${PUID}:${PGID}"
    environment:
      DATA_DIR: /data
      TZ: ${TZ}
    volumes:
      # SQLite database, uploaded statements and generated exports
      - ${APPDATA_PATH}/lexware-import/data:/data
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.lexware-import.tls: true
      traefik.http.routers.lexware-import.tls.certresolver: letsencrypt
      traefik.http.routers.lexware-import.rule: Host(`${SERVICE_URL}`)
      traefik.http.routers.lexware-import.entrypoints: websecure
      traefik.http.routers.lexware-import.service: lexware-import
      traefik.http.services.lexware-import.loadbalancer.server.port: 3000
      # the app has no auth of its own, Traefik puts tinyauth in front of it
      traefik.http.routers.lexware-import.middlewares: tinyauth

      tinyauth.apps.lexware-import.config.domain: ${SERVICE_URL}
      tinyauth.apps.lexware-import.oauth.groups: admin

      glance.name: Lexware Import
      glance.url: https://${SERVICE_URL}
      net.unraid.docker.webui: https://${SERVICE_URL}

networks:
  proxy:
    external: true
