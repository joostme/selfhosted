services:
  opencode:
    # opencode (OpenCode 2), gh and code-server are installed by mise on start
    # and upgraded on every restart (AUTO_UPDATE defaults to true)
    image: ghcr.io/joostme/opencode-docker:3.1.0
    container_name: opencode
    restart: unless-stopped
    environment:
      - TZ
      - PUID
      - PGID
      - OPENCODE_SERVER_PASSWORD
    volumes:
      - ${APPDATA_PATH}/repos:/repos
      - ${APPDATA_PATH}/opencode/share:/home/opencode/.local/share
      - ${APPDATA_PATH}/opencode/agents:/home/opencode/.agents
      - ${APPDATA_PATH}/opencode/config:/home/opencode/.config

      - ${APPDATA_PATH}/.ssh:/home/opencode/.ssh-keys:ro
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.opencode.tls: true
      traefik.http.routers.opencode.tls.certresolver: letsencrypt
      traefik.http.routers.opencode.rule: Host(`${SERVICE_URL_OPENCODE}`)
      traefik.http.routers.opencode.entrypoints: websecure
      traefik.http.routers.opencode.service: opencode
      traefik.http.services.opencode.loadbalancer.server.port: 4096

      traefik.http.routers.opencode-code.tls: true
      traefik.http.routers.opencode-code.tls.certresolver: letsencrypt
      traefik.http.routers.opencode-code.rule: Host(`${SERVICE_URL_CODESERVER}`)
      traefik.http.routers.opencode-code.entrypoints: websecure
      traefik.http.routers.opencode-code.service: opencode-code
      traefik.http.services.opencode-code.loadbalancer.server.port: 8080

      glance.name: OpenCode
      glance.url: https://${SERVICE_URL_OPENCODE}
      net.unraid.docker.webui: https://${SERVICE_URL_OPENCODE}

networks:
  proxy:
    external: true
