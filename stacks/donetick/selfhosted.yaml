name: "selfhosted"
is_done_tick_dot_com: false
is_user_creation_disabled: false
telegram:
  token: ""
pushover:
  token: ""
sqlite:
  path: "/donetick-data/donetick.db"
database:
  type: "sqlite"
  migration: true
jwt:
  session_time: 168h # 7 days
  max_refresh: 1440h # 60 days
server:
  port: 2021
  read_timeout: 10s
  write_timeout: 10s
  rate_period: 60s
  rate_limit: 300
  cors_allow_origins:
    - "http://localhost:5173"
    - "http://localhost:7926"
    # the below are required for the android app to work
    - "https://localhost"
    - "http://localhost"
    - "capacitor://localhost"
    - "https://todo.${DOMAIN}"
  serve_frontend: true
  serve_swagger: true
  public_host: "https://todo.${DOMAIN}" # example: https://yourpublicdomain.com
logging:
  level: "info"
  encoding: "json"
  development: false
scheduler_jobs:
  due_job: 30m
  overdue_job: 3h
  pre_due_job: 3h
email:
  host:
  port:
  key:
  email:
  user: # optional, will be filled with email.email if not set.
  appHost:
  log_raw_url: true # log password reset URL to console (useful when email is not configured)
oauth2:
  client_id: Donetick
  auth_url: "https://id.${DOMAIN}/authorize"
  token_url: "https://id.${DOMAIN}/api/oidc/token"
  user_info_url: "https://id.${DOMAIN}/api/oidc/userinfo"
  redirect_url: "https://todo.${DOMAIN}/auth/oauth2"
  name: Donetick
  # OIDC group-based role mapping (optional).
  # Users in these groups get the corresponding role on every OIDC login.
  admin_groups:
    - "admin"
  # manager_groups:
  #   - "donetick-managers"
# Single-circle instance mode (optional).
# When true, disables circle join/leave endpoints and adds new OIDC users
# to a shared household circle instead of creating personal circles.
single_circle_instance: true
# SSO-only mode (optional).
# When true, all password-based auth (signup, login, reset) is rejected and
# the login UI hides the password form.
disable_password_auth: true
# Real-time configuration
realtime:
  enabled: true
  sse_enabled: true
  heartbeat_interval: 60s
  connection_timeout: 120s
  max_connections: 1000
  max_connections_per_user: 5
  event_queue_size: 2048
  cleanup_interval: 2m
  stale_threshold: 5m
  enable_compression: true
  enable_stats: true
  allowed_origins:
    - "*"
