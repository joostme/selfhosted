services:
  tonies:
    image: git.${DOMAIN}/joost/tonies:latest
    container_name: tonies
    restart: unless-stopped
    pull_policy: always
    user: "${PUID}:${PGID}"
    environment:
      PORT: 3000
      CONTENT_DIR: /content
      CACHE_DIR: /data
      TZ: ${TZ}
    volumes:
      - ${APPDATA_PATH}/teddycloud/data/content/default:/content
      - ${APPDATA_PATH}/tonies/data:/data
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.docker.network: proxy
      traefik.http.routers.tonies.tls: true
      traefik.http.routers.tonies.tls.certresolver: letsencrypt
      traefik.http.routers.tonies.rule: Host(`${SERVICE_URL}`)
      traefik.http.routers.tonies.entrypoints: websecure
      traefik.http.routers.tonies.service: tonies
      traefik.http.services.tonies.loadbalancer.server.port: 3000
      glance.name: Tonies
      glance.url: https://${SERVICE_URL}
      net.unraid.docker.webui: https://${SERVICE_URL}
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
networks:
  proxy:
    external: true
