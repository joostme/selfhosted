services:
  immich:
    container_name: immich
    image: ghcr.io/immich-app/immich-server:v3.3.4
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    # render group of /dev/dri/renderD128 on the host, needed for hardware transcoding as non-root
    group_add:
      - "18"
    environment:
      - TZ
      - DB_HOSTNAME=postgres_immich
      - DB_USERNAME=postgres
      - DB_PASSWORD
      - DB_DATABASE_NAME=immich
      - DB_PORT=5432
      - REDIS_HOSTNAME=redis
      - REDIS_PORT=6379
      # keep the paths the database already references from the imagegenius image
      - IMMICH_MEDIA_LOCATION=/photos
      - IMMICH_MACHINE_LEARNING_URL=http://immich-machine-learning:3003
    volumes:
      - ${MNT_PATH}/photos/immich/:/photos
      - ${MNT_PATH}/photos/libraries/:/libraries
    networks:
      - proxy
      - redis_net
      - immich
    devices:
      - "/dev/dri:/dev/dri"
    depends_on:
      - postgres_immich
    labels:
      traefik.enable: true
      traefik.http.routers.immich.tls: true
      traefik.http.routers.immich.tls.certresolver: letsencrypt
      traefik.http.routers.immich.rule: Host(`${SERVICE_URL}`)
      traefik.http.routers.immich.entrypoints: websecure
      traefik.http.services.immich.loadbalancer.server.port: 2283

      glance.id: immich
      glance.name: Immich
      glance.icon: sh:immich
      glance.url: https://${SERVICE_URL}
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/immich.png
      net.unraid.docker.webui: https://${SERVICE_URL}

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.4
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      - TZ
      - MACHINE_LEARNING_WORKERS=1
      - MACHINE_LEARNING_WORKER_TIMEOUT=120
    volumes:
      # model cache downloaded by the imagegenius image, same layout including hf-cache
      - ${APPDATA_PATH}/immich/machine-learning/models:/cache
    networks:
      - immich
    labels:
      glance.parent: immich
      glance.name: Immich Machine Learning
      glance.icon: sh:immich
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/immich.png


  postgres_immich:
    container_name: postgres_immich
    image: ghcr.io/immich-app/postgres:16-vectorchord0.3.0-pgvectors0.3.0
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
    volumes:
      - ${APPDATA_PATH}/postgresql_immich:/var/lib/postgresql/data
    networks:
      - immich
    labels:
      glance.parent: immich
      glance.name: Immich Postgres
      glance.icon: sh:postgresql
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/postgresql.png

networks:
  immich:
  proxy:
    external: true
  redis_net:
    external: true
